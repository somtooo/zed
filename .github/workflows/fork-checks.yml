# FORK-ONLY workflow: hand-maintained, NOT generated by `cargo xtask workflows`.
# Full gate for this fork: mirrors the Linux leg upstream's run_tests.yml
# requires before PRs merge (the `tests_pass` gate), so syncs and releases get
# the same bar here on the fork's own runners:
#   clippy  = ./script/clippy (workspace, deny warnings)
#   tests   = cargo nextest run --workspace --no-fail-fast
#   doctests = cargo test --workspace --doc --no-fail-fast
# Upstream's own run_tests.yml is owner-gated to zed-industries with custom
# runners, so it never runs on this fork -- this is its replacement.
# Runs on PRs to develop (and main) and on demand. Also on push to
# release/** branches: release branches carry these workflow files, so the
# push run is what the fork-release guard looks up. (Deliberately NOT on push
# to develop/main: post-merge heads there are already covered by the PR run,
# so that would just burn hours of runner time for the same result.)
name: fork-checks

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  # The runner profile brings 8 CPUs and ~15GB of RAM plus swap, so the build
  # can use every core; swap absorbs the spikes from the heaviest units
  # (webrtc) that would otherwise OOM-kill the compiler.
  CARGO_BUILD_JOBS: "8"
  CC: clang
  CXX: clang++

jobs:
  clippy:
    runs-on: namespace-profile-zed-linux
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space and quiet the sudo hint
        run: |
          # Full-workspace debug builds (webrtc et al.) need disk: ditch the
          # Android SDK/dotnet caches we never use. Swap comes from the runner
          # profile -- the runner does not grant the privileges `swapon`
          # needs, so the job cannot create a swapfile itself.
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          docker system prune -af || true
          df -h / | tail -1
          # The runner image's /etc/bash.bashrc carries Ubuntu's "sudo hint",
          # which every interactive shell prints. Upstream's remote_server
          # tests assert on the exact stdout of an interactive shell, so the
          # hint breaks them. GitHub-hosted runners suppress it with a marker
          # file; drop the whole block instead.
          sudo sed -i '/^# sudo hint/,/^fi$/d' /etc/bash.bashrc

      - name: Setup cargo CI config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        # The runner profile has a Cache Volume attached: the registry, the
        # git dependencies and the build artifacts live on local NVMe, so a
        # warm run skips most of the compile.
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Setup Linux
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Clippy
        run: ./script/clippy

      - name: Cleanup cargo config
        if: always()
        run: rm -rf ./../.cargo

  tests:
    runs-on: namespace-profile-zed-linux
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 500ms
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space and quiet the sudo hint
        run: |
          # Full-workspace debug builds (webrtc et al.) need disk: ditch the
          # Android SDK/dotnet caches we never use. Swap comes from the runner
          # profile -- the runner does not grant the privileges `swapon`
          # needs, so the job cannot create a swapfile itself.
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          docker system prune -af || true
          df -h / | tail -1
          # The runner image's /etc/bash.bashrc carries Ubuntu's "sudo hint",
          # which every interactive shell prints. Upstream's remote_server
          # tests assert on the exact stdout of an interactive shell, so the
          # hint breaks them. GitHub-hosted runners suppress it with a marker
          # file; drop the two echo lines instead.
          sudo sed -i '/^# sudo hint/,/^fi$/d' /etc/bash.bashrc

      - name: Setup cargo CI config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        # The runner profile has a Cache Volume attached: the registry, the
        # git dependencies and the build artifacts live on local NVMe, so a
        # warm run skips most of the compile.
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Setup Linux
        run: ./script/linux

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Setup software rendering (no GPU on the runner)
        run: sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers

      - name: Full test suite
        run: |
          set -euo pipefail
          # Uncommitted on purpose: .config/nextest.toml is upstream-owned.
          # The runners are slower than upstream's, so give the two
          # known-slow tests the same 300s budget upstream grants its own
          # slow ones, and retry flakes once (cargo cache makes retries fast).
          cat >> .config/nextest.toml <<'EOF'

          [[profile.default.overrides]]
          filter = 'test(test_random_columnar_selections) or test(test_completion_without_text_edit) or test(test_random_worktree_changes)'
          slow-timeout = { period = "300s", terminate-after = 1 }
          EOF
          xvfb-run -a cargo nextest run --workspace --no-fail-fast --no-tests=warn --retries 1

      - name: Cleanup cargo config
        if: always()
        run: rm -rf ./../.cargo

  doctests:
    runs-on: namespace-profile-zed-linux
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space and quiet the sudo hint
        run: |
          # Full-workspace debug builds (webrtc et al.) need disk: ditch the
          # Android SDK/dotnet caches we never use. Swap comes from the runner
          # profile -- the runner does not grant the privileges `swapon`
          # needs, so the job cannot create a swapfile itself.
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          docker system prune -af || true
          df -h / | tail -1
          # The runner image's /etc/bash.bashrc carries Ubuntu's "sudo hint",
          # which every interactive shell prints. Upstream's remote_server
          # tests assert on the exact stdout of an interactive shell, so the
          # hint breaks them. GitHub-hosted runners suppress it with a marker
          # file; drop the two echo lines instead.
          sudo sed -i '/^# sudo hint/,/^fi$/d' /etc/bash.bashrc

      - name: Setup cargo CI config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        # The runner profile has a Cache Volume attached: the registry, the
        # git dependencies and the build artifacts live on local NVMe, so a
        # warm run skips most of the compile.
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Setup Linux
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Doctests
        run: cargo test --workspace --doc --no-fail-fast

      - name: Cleanup cargo config
        if: always()
        run: rm -rf ./../.cargo

  verify_pass:
    needs: [clippy, tests, doctests]
    if: always()
    runs-on: namespace-profile-zed-linux
    steps:
      - name: Gate
        run: |
          set +x
          EXIT_CODE=0
          check_result() {
            echo "* $1: $2"
            if [[ "$2" != "skipped" && "$2" != "success" ]]; then EXIT_CODE=1; fi
          }
          check_result "clippy" "${{ needs.clippy.result }}"
          check_result "tests" "${{ needs.tests.result }}"
          check_result "doctests" "${{ needs.doctests.result }}"
          exit $EXIT_CODE
