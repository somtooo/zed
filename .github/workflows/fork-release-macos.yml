# FORK-ONLY workflow: hand-maintained, NOT generated by `cargo xtask workflows`.
# Test harness for the macOS half of fork-release.yml. It builds ONLY the
# macOS DMG so the macOS build can be debugged without also paying for the
# Linux build. The guard job and its skip_checks input are identical to
# fork-release.yml, so branch validation and the fork-checks gate behave the
# same way; only the build and publish steps differ.
#
# Once this is green, fold the macOS job's fixes back into fork-release.yml
# and delete this file.
#
# Why the macOS job needs extra care: macOS runner images ship every recent
# Xcode plus simulator runtimes for iOS/tvOS/watchOS/visionOS, while the
# runner only guarantees 14 GB of free space. A full release build of zed
# (two feature-unified cargo invocations, LTO, webrtc-sys, wasmtime) does not
# fit in what is left, so the build has to reclaim disk before it starts.
name: fork-release-macos

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch (e.g. release/fork-v1.24.3)"
        required: true
        type: string
      tag:
        description: "Release tag (default: derived from branch)"
        required: false
        default: ""
        type: string
      skip_checks:
        description: "Skip the fork-checks green-on-head requirement"
        required: false
        default: true
        type: boolean
      publish:
        description: "Create the GitHub release (off while testing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fork-release-macos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      branch: ${{ steps.tag.outputs.branch }}
      upstream_tag: ${{ steps.upstream.outputs.value }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate branch and derive tag
        id: tag
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch }}"
          case "$BRANCH" in
            release/fork-v*) ;;
            *) echo "::error::branch must look like 'release/fork-vX.Y.Z' (got '$BRANCH')"; exit 1 ;;
          esac
          if ! git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
            echo "::error::branch $BRANCH not found on origin"
            exit 1
          fi
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${BRANCH#release/}"
            N=1
            while git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; do
              N=$((N + 1))
              TAG="${BRANCH#release/}.$N"
            done
          fi
          case "$TAG" in
            fork-v*) ;;
            *) echo "::error::tag must look like 'fork-vX.Y.Z' (got '$TAG')"; exit 1 ;;
          esac
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from $BRANCH"
          {
            echo "branch<<EOF"
            echo "$BRANCH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Record upstream base
        id: upstream
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch }}"
          UPSTREAM_TAG="${BRANCH#release/fork-}"
          case "$UPSTREAM_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::cannot derive upstream tag from branch '$BRANCH'"; exit 1 ;;
          esac
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/zed-industries/zed.git
          fi
          git fetch upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          if ! git rev-parse --verify --quiet "refs/tags/$UPSTREAM_TAG" >/dev/null; then
            echo "::error::upstream tag $UPSTREAM_TAG not found"
            exit 1
          fi
          echo "value=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream base: $UPSTREAM_TAG ($(git rev-parse --short "$UPSTREAM_TAG"))"

      - name: Require fork-checks green on branch head
        if: ${{ !inputs.skip_checks }}
        run: |
          set -euo pipefail
          # Pushing the release branch runs fork-checks on it (the branch
          # carries the workflow files), so a green run must exist for this
          # exact head. Look it up by commit SHA.
          HEAD=$(git rev-parse HEAD)
          GREEN=$(H1="$HEAD" gh run list --workflow fork-checks.yml --repo "${{ github.repository }}" --limit 20 \
            --json headSha,conclusion \
            --jq '[.[] | select(.headSha == env.H1 and .conclusion == "success")] | length')
          if [ "$GREEN" -eq 0 ]; then
            echo "::error::fork-checks is not green on $HEAD -- push to the release branch and re-dispatch when green, or re-run with skip_checks"
            exit 1
          fi
          echo "fork-checks green for $HEAD"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-aarch64:
    needs: guard
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Free disk space
        run: |
          set -euo pipefail
          # The runner image ships every recent Xcode plus simulator runtimes
          # for four platforms. The build needs the disk more than it needs
          # any of that, so reclaim it before cargo starts.
          echo "=== Disk before cleanup ==="
          df -h /System/Volumes/Data

          # Pick the Xcode to build with before deleting anything: the newest
          # 16.x. It supports the C++20 that webrtc-sys compiles with, and
          # unlike Xcode 26 it still bundles the Metal toolchain.
          #
          # The image ships both /Applications/Xcode_16.4.app and the
          # /Applications/Xcode_16.4.0.app symlink pointing at it, so
          # resolve symlinks and de-duplicate before comparing versions.
          KEEP_XCODE=$(python3 - <<'PY'
          import glob, os, re

          best_path = None
          best_version = None
          seen = set()
          for path in glob.glob('/Applications/Xcode*.app'):
              if not os.path.isdir(path):
                  continue
              real = os.path.realpath(path)
              if real in seen:
                  continue
              seen.add(real)
              match = re.match(r'Xcode_(\d+)\.(\d+)', os.path.basename(real))
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              if version[0] != 16:
                  continue
              if best_version is None or version > best_version:
                  best_version = version
                  best_path = real
          print(best_path or '')
          PY
          )
          if [ -z "$KEEP_XCODE" ]; then
            echo "::error::no Xcode 16.x found on this runner"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Keeping Xcode: $KEEP_XCODE"

          # Remove every other Xcode, including the symlinks that point at
          # them, so their platforms and simulators go with them.
          for xcode in /Applications/Xcode*.app; do
            real=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$xcode")
            if [ "$real" != "$KEEP_XCODE" ]; then
              echo "Removing $xcode"
              sudo rm -rf "$xcode" &
            fi
          done
          wait

          # Simulator runtimes are the other large chunk of the image.
          sudo xcrun simctl runtime delete all 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /Users/runner/.dotnet
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /Users/runner/Library/Caches/Homebrew

          echo "=== Disk after cleanup ==="
          df -h /System/Volumes/Data

      - name: Select Xcode
        run: |
          set -euo pipefail
          KEEP_XCODE=$(python3 - <<'PY'
          import glob, os, re

          best_path = None
          best_version = None
          seen = set()
          for path in glob.glob('/Applications/Xcode*.app'):
              if not os.path.isdir(path):
                  continue
              real = os.path.realpath(path)
              if real in seen:
                  continue
              seen.add(real)
              match = re.match(r'Xcode_(\d+)\.(\d+)', os.path.basename(real))
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              if version[0] != 16:
                  continue
              if best_version is None or version > best_version:
                  best_version = version
                  best_path = real
          print(best_path or '')
          PY
          )
          echo "Using $KEEP_XCODE"
          sudo xcode-select -s "$KEEP_XCODE/Contents/Developer"
          # Build scripts call `xcrun` directly, and xcrun prefers
          # DEVELOPER_DIR over the system-wide selection, so export it for
          # every later step.
          echo "DEVELOPER_DIR=$KEEP_XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Verify Metal toolchain
        run: |
          set -euo pipefail
          # Xcode 26 unbundled the Metal toolchain, and a toolchain installed
          # for one user is invisible to another. Fail early with a clear
          # message instead of deep inside a build script.
          if ! xcrun metal --version; then
            echo "Metal toolchain missing, downloading it..."
            xcodebuild -downloadComponent MetalToolchain
            # The toolchain is indexed per user, so make sure this user can
            # see it before trying again.
            xcodebuild -showComponent MetalToolchain
            xcrun metal --version
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-target: false

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Bundle macOS release (unsigned)
        run: ./script/bundle-mac aarch64-apple-darwin

      - name: Report disk usage
        if: always()
        run: |
          echo "=== Disk after build ==="
          df -h /System/Volumes/Data
          du -sh target 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fork-macos-aarch64
          path: |
            target/aarch64-apple-darwin/release/Zed-aarch64.dmg
            target/zed-remote-server-macos-aarch64.gz
          if-no-files-found: error

  publish:
    needs: [guard, build-macos-aarch64]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tag and publish release
        run: |
          set -euo pipefail
          TAG="${{ needs.guard.outputs.tag }}"
          UPSTREAM_TAG="${{ needs.guard.outputs.upstream_tag }}"
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/zed-industries/zed.git
          fi
          git fetch upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          HEAD_SHA=$(git rev-parse --short HEAD)
          PICKS=$(git log "$UPSTREAM_TAG"..HEAD --format='- %s')
          git tag -a "$TAG" -m "Fork release $TAG

          Upstream base: $UPSTREAM_TAG ($(git rev-parse --short "$UPSTREAM_TAG"))
          Picks:
          $PICKS"
          git push origin "$TAG"
          ls -la dist
          # Artifacts nest one level (aarch64-apple-darwin/, release/), so
          # collect files recursively instead of dist/*.
          # --repo is mandatory: with an `upstream` remote present, gh
          # targets the parent repo (zed-industries/zed) by default.
          # shellcheck disable=SC2046
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" \
            --notes "Fork release $TAG: upstream $UPSTREAM_TAG plus cherry-picked features, built from ${{ needs.guard.outputs.branch }} at $HEAD_SHA (macOS build is unsigned: right-click > Open on first launch).

          Picks:
          $PICKS" \
            $(find dist -type f | sort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
