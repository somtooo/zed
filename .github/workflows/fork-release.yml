# FORK-ONLY workflow: hand-maintained, NOT generated by `cargo xtask workflows`.
# Cut a fork release off a release branch with downloadable binaries, the
# same artifacts the Zed team builds for their releases (release.yml), minus
# what needs their secrets:
#   linux x86_64  = ./script/bundle-linux            -> zed-linux-x86_64.tar.gz
#   macOS arm64   = ./script/bundle-mac aarch64-apple-darwin -> Zed-aarch64.dmg
# (each plus its remote-server archive). Sentry upload and Apple
# signing/notarization are skipped automatically without their secrets, so the
# macOS DMG is UNSIGNED -- Gatekeeper will ask users to right-click > Open on
# first launch.
#
# Model: release branches are built locally first with script/fork-release:
#   release/<tag> = <upstream stable tag> + cherry-picked feature commits.
# This workflow verifies the branch (clippy + nextest + doctests run here on
# the release tree itself -- release branches carry no workflow files, so the
# fork-checks workflow cannot run against them), tags it, builds it, and
# publishes the tag. Tag scheme: fork-<upstream release> (e.g. fork-v1.20.2);
# -pre tags are skipped. Set skip_checks only to bypass the inline gate.
name: fork-release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch (e.g. release/fork-v1.20.2)"
        required: true
        type: string
      tag:
        description: "Release tag (default: derived from branch)"
        required: false
        default: ""
        type: string
      skip_checks:
        description: "Skip the inline verification gate"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      branch: ${{ steps.tag.outputs.branch }}
      upstream_tag: ${{ steps.upstream.outputs.value }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate branch and derive tag
        id: tag
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch }}"
          case "$BRANCH" in
            release/fork-v*) ;;
            *) echo "::error::branch must look like 'release/fork-vX.Y.Z' (got '$BRANCH')"; exit 1 ;;
          esac
          if ! git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
            echo "::error::branch $BRANCH not found on origin"
            exit 1
          fi
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${BRANCH#release/}"
            N=1
            while git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; do
              N=$((N + 1))
              TAG="${BRANCH#release/}.$N"
            done
          fi
          case "$TAG" in
            fork-v*) ;;
            *) echo "::error::tag must look like 'fork-vX.Y.Z' (got '$TAG')"; exit 1 ;;
          esac
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from $BRANCH"
          {
            echo "branch<<EOF"
            echo "$BRANCH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Record upstream base
        id: upstream
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch }}"
          UPSTREAM_TAG="${BRANCH#release/fork-}"
          case "$UPSTREAM_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::cannot derive upstream tag from branch '$BRANCH'"; exit 1 ;;
          esac
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/zed-industries/zed.git
          fi
          git fetch upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          if ! git rev-parse --verify --quiet "refs/tags/$UPSTREAM_TAG" >/dev/null; then
            echo "::error::upstream tag $UPSTREAM_TAG not found"
            exit 1
          fi
          echo "value=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream base: $UPSTREAM_TAG ($(git rev-parse --short "$UPSTREAM_TAG"))"

  verify-clippy:
    needs: guard
    if: ${{ !inputs.skip_checks }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}

      - name: Setup cargo CI config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Linux
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Clippy
        run: ./script/clippy

      - name: Cleanup cargo config
        if: always()
        run: rm -rf ./../.cargo

  verify-tests:
    needs: guard
    if: ${{ !inputs.skip_checks }}
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 500ms
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}

      - name: Setup cargo CI config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Linux
        run: ./script/linux

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Setup software rendering (no GPU on free runners)
        run: sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers

      - name: Full test suite
        run: |
          set -euo pipefail
          # Uncommitted on purpose: .config/nextest.toml is upstream-owned.
          # Free runners are ~4x slower than upstream's, so give the two
          # known-slow tests the same 300s budget upstream grants its own
          # slow ones, and retry flakes once (cargo cache makes retries fast).
          cat >> .config/nextest.toml <<'EOF'

          [[profile.default.overrides]]
          filter = 'test(test_random_columnar_selections) or test(test_completion_without_text_edit) or test(test_random_worktree_changes)'
          slow-timeout = { period = "300s", terminate-after = 1 }
          EOF
          xvfb-run -a cargo nextest run --workspace --no-fail-fast --no-tests=warn --retries 1

      - name: Cleanup cargo config
        if: always()
        run: rm -rf ./../.cargo

  verify-doctests:
    needs: guard
    if: ${{ !inputs.skip_checks }}
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}

      - name: Setup cargo CI config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Linux
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Doctests
        run: cargo test --workspace --doc --no-fail-fast

      - name: Cleanup cargo config
        if: always()
        run: rm -rf ./../.cargo

  build-linux-x86_64:
    needs: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Linux
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Bundle Linux release
        run: ./script/bundle-linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fork-linux-x86_64
          path: |
            target/release/zed-linux-x86_64.tar.gz
            target/zed-remote-server-linux-x86_64.gz
          if-no-files-found: error

  build-macos-aarch64:
    needs: guard
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Select newest Xcode (WebRTC needs a current toolchain)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Bundle macOS release (unsigned)
        run: ./script/bundle-mac aarch64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fork-macos-aarch64
          path: |
            target/aarch64-apple-darwin/release/Zed-aarch64.dmg
            target/zed-remote-server-macos-aarch64.gz
          if-no-files-found: error

  publish:
    needs: [guard, verify-clippy, verify-tests, verify-doctests, build-linux-x86_64, build-macos-aarch64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          set +x
          SKIP="${{ inputs.skip_checks }}"
          fail_unless_ok() {
            echo "* $1: $2"
            if [[ "$2" == "success" ]]; then return; fi
            if [[ "$SKIP" == "true" && "$2" == "skipped" ]]; then return; fi
            exit 1
          }
          [ "${{ needs.guard.result }}" == "success" ] || exit 1
          fail_unless_ok "verify-clippy" "${{ needs.verify-clippy.result }}"
          fail_unless_ok "verify-tests" "${{ needs.verify-tests.result }}"
          fail_unless_ok "verify-doctests" "${{ needs.verify-doctests.result }}"
          [ "${{ needs.build-linux-x86_64.result }}" == "success" ] || exit 1
          [ "${{ needs.build-macos-aarch64.result }}" == "success" ] || exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tag and publish release
        run: |
          set -euo pipefail
          TAG="${{ needs.guard.outputs.tag }}"
          UPSTREAM_TAG="${{ needs.guard.outputs.upstream_tag }}"
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/zed-industries/zed.git
          fi
          git fetch upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          HEAD_SHA=$(git rev-parse --short HEAD)
          PICKS=$(git log "$UPSTREAM_TAG"..HEAD --format='- %s')
          git tag -a "$TAG" -m "Fork release $TAG

          Upstream base: $UPSTREAM_TAG ($(git rev-parse --short "$UPSTREAM_TAG"))
          Picks:
          $PICKS"
          git push origin "$TAG"
          ls -la dist
          # Artifacts nest one level (aarch64-apple-darwin/, release/), so
          # collect files recursively instead of dist/*.
          # --repo is mandatory: with an `upstream` remote present, gh
          # targets the parent repo (zed-industries/zed) by default.
          # shellcheck disable=SC2046
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" \
            --notes "Fork release $TAG: upstream $UPSTREAM_TAG plus cherry-picked features, built from ${{ needs.guard.outputs.branch }} at $HEAD_SHA (macOS build is unsigned: right-click > Open on first launch).

          Picks:
          $PICKS" \
            $(find dist -type f | sort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
