# FORK-ONLY workflow: hand-maintained, NOT generated by `cargo xtask workflows`.
# Cut a fork release with downloadable binaries, the same artifacts the Zed
# team builds for their releases (release.yml), minus what needs their secrets:
#   linux x86_64  = ./script/bundle-linux            -> zed-linux-x86_64.tar.gz
#   macOS arm64   = ./script/bundle-mac aarch64-apple-darwin -> Zed-aarch64.dmg
# (each plus its remote-server archive). Sentry upload and Apple
# signing/notarization are skipped automatically without their secrets, so the
# macOS DMG is UNSIGNED -- Gatekeeper will ask users to right-click > Open on
# first launch.
# Tag scheme: fork-<latest stable upstream release> (e.g. fork-v1.20.2);
# -pre tags are skipped. Only dispatch when fork-checks is green on main --
# the guard job enforces this unless skip_checks is set.
name: fork-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: fork-<latest stable upstream>)"
        required: false
        default: ""
        type: string
      skip_checks:
        description: "Skip the fork-checks green-on-HEAD requirement"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            STABLE=$(git ls-remote --tags --refs https://github.com/zed-industries/zed.git \
              | awk '{print $2}' | sed 's|refs/tags/||' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1)
            if [ -z "$STABLE" ]; then
              echo "::error::could not determine latest stable upstream tag"
              exit 1
            fi
            TAG="fork-$STABLE"
            N=1
            while git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; do
              N=$((N + 1))
              TAG="fork-$STABLE.$N"
            done
          fi
          case "$TAG" in
            fork-v*) ;;
            *) echo "::error::tag must look like 'fork-vX.Y.Z' (got '$TAG')"; exit 1 ;;
          esac
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Require fork-checks green on HEAD
        if: ${{ ! inputs.skip_checks }}
        run: |
          set -euo pipefail
          HEAD=$(git rev-parse HEAD)
          PR_HEAD=""
          if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            PR_HEAD=$(git rev-parse HEAD^2)
          fi
          GREEN=$(gh run list --workflow fork-checks.yml --limit 20 \
            --json headSha,conclusion --arg h1 "$HEAD" --arg h2 "$PR_HEAD" \
            --jq '[.[] | select((.headSha == $h1 or .headSha == $h2) and .conclusion == "success")] | length')
          if [ "$GREEN" -eq 0 ]; then
            echo "::error::fork-checks is not green on $HEAD (nor its merged PR head) -- merge a green PR first or re-run with skip_checks"
            exit 1
          fi
          echo "fork-checks green for $HEAD"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-x86_64:
    needs: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Linux
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Bundle Linux release
        run: ./script/bundle-linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fork-linux-x86_64
          path: |
            target/release/zed-linux-x86_64.tar.gz
            target/zed-remote-server-linux-x86_64.gz
          if-no-files-found: error

  build-macos-aarch64:
    needs: guard
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Bundle macOS release (unsigned)
        run: ./script/bundle-mac aarch64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fork-macos-aarch64
          path: |
            target/aarch64-apple-darwin/release/Zed-aarch64.dmg
            target/zed-remote-server-macos-aarch64.gz
          if-no-files-found: error

  publish:
    needs: [guard, build-linux-x86_64, build-macos-aarch64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tag and publish release
        run: |
          set -euo pipefail
          TAG="${{ needs.guard.outputs.tag }}"
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/zed-industries/zed.git
          fi
          git fetch upstream
          UPSTREAM_BASE=$(git merge-base main upstream/main)
          git tag -a "$TAG" -m "Fork release $TAG

          Upstream base: $UPSTREAM_BASE"
          git push origin "$TAG"
          ls -la dist
          gh release create "$TAG" --title "$TAG" \
            --notes "Fork snapshot of main at $(git rev-parse --short HEAD) (upstream base $UPSTREAM_BASE). Linux x86_64 and macOS Apple Silicon builds attached (macOS build is unsigned: right-click > Open on first launch)." \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
