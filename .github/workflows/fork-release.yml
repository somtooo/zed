# FORK-ONLY workflow: hand-maintained, NOT generated by `cargo xtask workflows`.
# Cut a fork release off a release branch with downloadable binaries, the
# same artifacts the Zed team builds for their releases (release.yml), minus
# what needs their secrets:
#   linux x86_64  = ./script/bundle-linux            -> zed-linux-x86_64.tar.gz
#   macOS arm64   = ./script/bundle-mac aarch64-apple-darwin -> Zed-aarch64.dmg
# (each plus its remote-server archive). Sentry upload and Apple
# signing/notarization are skipped automatically without their secrets, so the
# macOS DMG is UNSIGNED -- Gatekeeper will ask users to right-click > Open on
# first launch.
#
# Model: release branches are built locally first with script/fork-release:
#   release/<tag> = <upstream stable tag> + infra commit + picked features.
# Release branches carry the fork automation, so pushing one runs fork-checks
# on it -- this workflow requires that run green on the branch head before
# tagging, building, and publishing. Tag scheme: fork-<upstream release>
# (e.g. fork-v1.20.2); -pre tags are skipped. Set skip_checks only to bypass
# the gate.
#
# The jobs run on the fork's own Namespace runner profiles:
# namespace-profile-zed-linux for the Linux bundle and the small helper jobs,
# namespace-profile-zed-mac for the macOS one. The Linux profile has to come
# with swap: a release build runs one rustc per core and the heavy ones
# (webrtc, the LTO link) need GBs each, so without swap the OOM killer takes
# the build down. The runner does not grant the privileges `swapon` needs, so
# the swap has to be part of the profile.
name: fork-release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch (e.g. release/fork-v1.20.2)"
        required: true
        type: string
      tag:
        description: "Release tag (default: derived from branch)"
        required: false
        default: ""
        type: string
      skip_checks:
        description: "Skip the fork-checks green-on-head requirement"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  guard:
    runs-on: namespace-profile-zed-linux
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      branch: ${{ steps.tag.outputs.branch }}
      upstream_tag: ${{ steps.upstream.outputs.value }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate branch and derive tag
        id: tag
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch }}"
          case "$BRANCH" in
            release/fork-v*) ;;
            *) echo "::error::branch must look like 'release/fork-vX.Y.Z' (got '$BRANCH')"; exit 1 ;;
          esac
          if ! git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
            echo "::error::branch $BRANCH not found on origin"
            exit 1
          fi
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${BRANCH#release/}"
            N=1
            while git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; do
              N=$((N + 1))
              TAG="${BRANCH#release/}.$N"
            done
          fi
          case "$TAG" in
            fork-v*) ;;
            *) echo "::error::tag must look like 'fork-vX.Y.Z' (got '$TAG')"; exit 1 ;;
          esac
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from $BRANCH"
          {
            echo "branch<<EOF"
            echo "$BRANCH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Record upstream base
        id: upstream
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch }}"
          UPSTREAM_TAG="${BRANCH#release/fork-}"
          case "$UPSTREAM_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::cannot derive upstream tag from branch '$BRANCH'"; exit 1 ;;
          esac
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/zed-industries/zed.git
          fi
          git fetch upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          if ! git rev-parse --verify --quiet "refs/tags/$UPSTREAM_TAG" >/dev/null; then
            echo "::error::upstream tag $UPSTREAM_TAG not found"
            exit 1
          fi
          echo "value=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream base: $UPSTREAM_TAG ($(git rev-parse --short "$UPSTREAM_TAG"))"

      - name: Require fork-checks green on branch head
        if: ${{ !inputs.skip_checks }}
        run: |
          set -euo pipefail
          # Pushing the release branch runs fork-checks on it (the branch
          # carries the workflow files), so a green run must exist for this
          # exact head. Look it up by commit SHA.
          HEAD=$(git rev-parse HEAD)
          GREEN=$(H1="$HEAD" gh run list --workflow fork-checks.yml --repo "${{ github.repository }}" --limit 20 \
            --json headSha,conclusion \
            --jq '[.[] | select(.headSha == env.H1 and .conclusion == "success")] | length')
          if [ "$GREEN" -eq 0 ]; then
            echo "::error::fork-checks is not green on $HEAD -- push to the release branch and re-dispatch when green, or re-run with skip_checks"
            exit 1
          fi
          echo "fork-checks green for $HEAD"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-x86_64:
    needs: guard
    runs-on: namespace-profile-zed-linux
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        # The runner profile has a Cache Volume attached: the registry, the
        # git dependencies and the build artifacts live on local NVMe, so a
        # warm run skips most of the compile.
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Setup Linux
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Bundle Linux release
        run: ./script/bundle-linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fork-linux-x86_64
          path: |
            target/release/zed-linux-x86_64.tar.gz
            target/zed-remote-server-linux-x86_64.gz
          if-no-files-found: error

  build-macos-aarch64:
    needs: guard
    runs-on: namespace-profile-zed-mac
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Free disk space
        run: |
          set -euo pipefail
          # A release build of zed needs a lot of disk, and the runner image
          # spends most of what it has on toolchains the build never touches:
          # simulator runtimes, the Android SDK, dotnet, PowerShell. Reclaim
          # those before cargo starts.
          echo "=== Disk before cleanup ==="
          df -h /System/Volumes/Data

          # The simulator runtimes live in mounted disk images, which have to
          # be unmounted before the directory can be removed.
          sudo xcrun simctl runtime delete all 2>/dev/null || true
          for volume in /Library/Developer/CoreSimulator/Volumes/*; do
            [ -d "$volume" ] || continue
            sudo diskutil unmount force "$volume" 2>/dev/null || true
          done
          sudo rm -rf /Library/Developer/CoreSimulator 2>/dev/null || true
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator" 2>/dev/null || true
          sudo rm -rf "$HOME/Library/Android" 2>/dev/null || true
          sudo rm -rf /usr/local/share/powershell 2>/dev/null || true
          sudo rm -rf "$HOME/.dotnet" 2>/dev/null || true
          sudo rm -rf /usr/local/share/dotnet 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf "$HOME/Library/Caches/Homebrew" 2>/dev/null || true

          echo "=== Disk after cleanup ==="
          df -h /System/Volumes/Data

      - name: Select Xcode (WebRTC needs a current toolchain)
        run: |
          set -euo pipefail
          # Prefer Xcode 16.x: it still bundles the Metal toolchain, while
          # Xcode 26 unbundled it. Fall back to the newest Xcode present when
          # the runner image ships no 16.x.
          KEEP_XCODE=$(python3 - <<'PY'
          import glob, os, re

          candidates = []
          seen = set()
          for path in glob.glob('/Applications/Xcode*.app'):
              if not os.path.isdir(path):
                  continue
              real = os.path.realpath(path)
              if real in seen:
                  continue
              seen.add(real)
              match = re.match(r'Xcode_(\d+)\.(\d+)', os.path.basename(real))
              version = (int(match.group(1)), int(match.group(2))) if match else (0, 0)
              candidates.append((version, real))
          if not candidates:
              print('')
          else:
              sixteens = [candidate for candidate in candidates if candidate[0][0] == 16]
              print((max(sixteens) if sixteens else max(candidates))[1])
          PY
          )
          if [ -z "$KEEP_XCODE" ]; then
            echo "::error::no Xcode found on this runner"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Using $KEEP_XCODE"
          sudo xcode-select -s "$KEEP_XCODE/Contents/Developer"
          # Build scripts call `xcrun` directly, and xcrun prefers
          # DEVELOPER_DIR over the system-wide selection, so export it for
          # every later step.
          echo "DEVELOPER_DIR=$KEEP_XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Verify Metal toolchain
        run: |
          set -euo pipefail
          # Xcode 26 unbundled the Metal toolchain, and a toolchain installed
          # for one user is invisible to another. Fail early with a clear
          # message instead of deep inside a build script.
          if ! xcrun metal --version; then
            echo "Metal toolchain missing, downloading it..."
            xcodebuild -downloadComponent MetalToolchain
            # The toolchain is indexed per user, so make sure this user can
            # see it before trying again.
            xcodebuild -showComponent MetalToolchain
            xcrun metal --version
          fi

      - name: Cache Rust dependencies
        # The runner profile has a Cache Volume attached: the registry and
        # the git dependencies live on local NVMe. The release artifacts are
        # not cached: they are the output of this job.
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Bundle macOS release (unsigned)
        run: ./script/bundle-mac aarch64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fork-macos-aarch64
          path: |
            target/aarch64-apple-darwin/release/Zed-aarch64.dmg
            target/zed-remote-server-macos-aarch64.gz
          if-no-files-found: error

  publish:
    needs: [guard, build-linux-x86_64, build-macos-aarch64]
    runs-on: namespace-profile-zed-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tag and publish release
        run: |
          set -euo pipefail
          TAG="${{ needs.guard.outputs.tag }}"
          UPSTREAM_TAG="${{ needs.guard.outputs.upstream_tag }}"
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/zed-industries/zed.git
          fi
          git fetch upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          HEAD_SHA=$(git rev-parse --short HEAD)
          PICKS=$(git log "$UPSTREAM_TAG"..HEAD --format='- %s')
          git tag -a "$TAG" -m "Fork release $TAG

          Upstream base: $UPSTREAM_TAG ($(git rev-parse --short "$UPSTREAM_TAG"))
          Picks:
          $PICKS"
          git push origin "$TAG"
          ls -la dist
          # Artifacts nest one level (aarch64-apple-darwin/, release/), so
          # collect files recursively instead of dist/*.
          # --repo is mandatory: with an `upstream` remote present, gh
          # targets the parent repo (zed-industries/zed) by default.
          # shellcheck disable=SC2046
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" \
            --notes "Fork release $TAG: upstream $UPSTREAM_TAG plus cherry-picked features, built from ${{ needs.guard.outputs.branch }} at $HEAD_SHA (macOS build is unsigned: right-click > Open on first launch).

          Picks:
          $PICKS" \
            $(find dist -type f | sort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
