# FORK-ONLY workflow: hand-maintained, NOT generated by `cargo xtask workflows`.
# Keeps this fork synced with upstream. Model: main is a pristine mirror of
# upstream/main (fast-forward only -- it must never diverge); develop carries
# all custom commits linearly on top of main. Syncing means fast-forwarding
# main, then rebasing develop. There are no merge commits in this flow.
#
# A conflicted rebase is not a stop-and-fix-locally affair anymore: the
# `resolve` job runs script/fork-resolve with opencode inside a
# Namespace Devbox (the image carries an authenticated opencode). The resolver
# repairs build and focused test failures in changed Rust packages before the
# full fork-checks gate runs; only a fully verified result is pushed to develop.
# If resolution or either test gate fails, the conflict is resolved locally as
# before.
#
# The `selftest` input only exercises the Devbox path (create, exec, delete)
# without syncing anything -- it is how the Devbox wiring gets checked
# without waiting for a real conflict.
name: fork-sync

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to sync (default: develop)"
        required: false
        default: "develop"
        type: string
      selftest:
        description: "Only exercise the Devbox path (create, exec, delete), do not sync"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

# NOTE: rebasing develop rewrites commits that touch workflow files, and
# GitHub's built-in token can never push those (no such scope exists for
# it). This workflow therefore authenticates with a personal token stored
# as the FORK_SYNC_PAT secret (classic PAT with the `workflow` scope, or
# fine-grained with Contents + Workflows read/write). The actions: write
# permission lets the final step dispatch fork-checks on the synced develop.

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  # The workspace-access Devbox that holds the authenticated opencode and
  # the fork's clone. The runner's workload identity can drive it.
  DEVBOX_NAME: linux-box
  # The model the conflict resolution runs on. The Devbox has opencode
  # connected to the GitHub Copilot provider.
  OPENCODE_MODEL: github-copilot/claude-sonnet-5.5
  # The model used when the resolution has to run on the runner itself: the
  # runner has no opencode credentials, so it uses the free models.
  OPENCODE_MODEL_FALLBACK: opencode/deepseek-v4.1-flash-free

jobs:
  sync:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.selftest == true) }}
    runs-on: namespace-profile-zed-linux
    outputs:
      branch: ${{ inputs.branch || 'develop' }}
      behind: ${{ steps.behind.outputs.count }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and fast-forward main
        run: |
          set -euo pipefail
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/zed-industries/zed.git
          fi
          git fetch upstream
          git fetch origin
          # Explicit -B checkouts: bare `git checkout main` is ambiguous
          # once both origin/main and upstream/main exist locally.
          git checkout -B main origin/main
          AHEAD=$(git rev-list --count upstream/main..main)
          if [ "$AHEAD" -ne 0 ]; then
            echo "::error::main has diverged from upstream/main ($AHEAD commits) -- main must stay a pristine mirror. Reset it explicitly, never merge."
            exit 1
          fi
          BEHIND=$(git rev-list --count main..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "main already up to date."
          else
            git merge --ff-only upstream/main
            git push origin main
            echo "main fast-forwarded by $BEHIND commit(s)."
          fi

      - name: Report what is left to sync
        id: behind
        env:
          BRANCH: ${{ inputs.branch || 'develop' }}
        run: |
          set -euo pipefail
          git fetch origin
          COUNT=$(git rev-list --count "origin/$BRANCH"..origin/main)
          echo "branch: $BRANCH"
          echo "behind main by $COUNT commit(s)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

  resolve:
    needs: sync
    # Nothing to sync when the branch already contains main: it was
    # rebased onto it before, so its code is already adapted to it.
    if: ${{ needs.sync.outputs.behind != '0' }}
    runs-on: namespace-profile-zed-linux
    timeout-minutes: 300
    permissions:
      # The GitHub token exchange needs the OIDC endpoint to identify the
      # job's GitHub identity.
      id-token: write
      contents: write
      actions: write
    env:
      FORK_SYNC_PAT: ${{ secrets.FORK_SYNC_PAT }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_PAT }}

      - name: Install the Devbox CLI
        run: |
          set -euo pipefail
          curl -fsSL get.namespace.so/devbox/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v devbox >/dev/null || {
            echo "::error::the Devbox CLI is not on PATH after the install script"
            exit 1
          }
          devbox version

      - name: Authenticate to Namespace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The runner's workload identity is scoped to the runner's own
          # features, so the API refuses to let it drive a Devbox. Exchanging
          # the job's GitHub token gives a credential for the linked
          # Namespace user instead, which carries the Devbox User role.
          if command -v nsc >/dev/null 2>&1 && nsc auth exchange-github-token; then
            echo "exchanged the job's GitHub token for a Namespace credential"
          else
            echo "::warning::the GitHub token exchange failed -- falling back to the runner's workload identity"
            TOKEN_FILE="${NSC_TOKEN_FILE:-/var/run/nsc/token.json}"
            if [ ! -f "$TOKEN_FILE" ]; then
              echo "::error::no Namespace token at $TOKEN_FILE -- the runner handed over no workload identity"
              exit 1
            fi
            mkdir -p "$HOME/.config/ns"
            [ -f "$HOME/.config/ns/config.json" ] || echo '{}' > "$HOME/.config/ns/config.json"
            cp "$TOKEN_FILE" "$HOME/.config/ns/token.json"
            chmod 600 "$HOME/.config/ns/token.json"
          fi
          devbox auth check-login || {
            echo "::error::the Devbox CLI is not authenticated"
            exit 1
          }

      - name: Setup Node
        if: ${{ always() }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache Rust dependencies
        # The repair phase after the rebase runs clippy over the whole
        # workspace, and the WebRTC C++ build alone is most of that. The
        # runner's Cache Volume keeps the registry, the git dependencies
        # and the build artifacts, so the repair phase starts warm instead
        # of compiling everything from scratch.
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Rebase and repair the branch
        run: |
          set -euo pipefail
          # The Devbox holds an authenticated opencode and the fork's clone,
          # so the resolution runs there when the workspace lets the runner
          # drive it. When it does not, the resolution runs on the runner
          # instead: same resolver, same prompt, only the machine differs.
          cat > /tmp/resolve-in-devbox.sh <<'DEVOX'
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}.git"
          REF_NAME="${{ github.ref_name }}"
          BRANCH="${{ needs.sync.outputs.branch }}"
          WORK_DIR="/workspaces/sync-${{ github.run_id }}"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # The image needs the WebRTC build dependency and the headless Linux
          # test renderer used by the focused preflight.
          if ! command -v cmake >/dev/null 2>&1 \
            || ! command -v jq >/dev/null 2>&1 \
            || ! command -v rg >/dev/null 2>&1 \
            || ! command -v xvfb-run >/dev/null 2>&1 \
            || ! dpkg-query -W cmake jq ripgrep xvfb libgl1-mesa-dri mesa-vulkan-drivers >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq cmake jq ripgrep xvfb libgl1-mesa-dri mesa-vulkan-drivers
          fi
          sudo sed -i '/^# sudo hint/,/^fi$/d' /etc/bash.bashrc

          rm -rf "$WORK_DIR"
          git clone "$REPO_URL" "$WORK_DIR"
          cd "$WORK_DIR"
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch upstream
          git fetch origin
          git checkout -B "$BRANCH" "origin/$BRANCH"
          # The resolver comes from the ref this workflow runs on, so it is
          # available even when the rebase is still replaying the commit
          # that introduced it.
          git show "origin/$REF_NAME:script/fork-resolve" > /tmp/fork-resolve
          bash /tmp/fork-resolve --onto origin/main --model "${{ env.OPENCODE_MODEL }}" --test-touched-packages
          # Hand the rebased commits back to the runner as a bundle: the
          # runner has the base (main) and the credentials to push.
          git bundle create "$WORK_DIR/resolved.bundle" "$BRANCH" ^origin/main
          git log --oneline -3
          DEVOX

          if devbox exec "${{ env.DEVBOX_NAME }}" -- bash -c "$(cat /tmp/resolve-in-devbox.sh)"; then
            echo "resolved in the Devbox"
            devbox download "${{ env.DEVBOX_NAME }}" "/workspaces/sync-${{ github.run_id }}/resolved.bundle" /tmp/resolved.bundle
          else
            echo "::warning::the Devbox would not take the job -- resolving on the runner instead"
            npm install -g --prefix "$HOME/.local" opencode-ai
            export PATH="$HOME/.local/bin:$PATH"
            # The resolver has to survive the checkout of develop below, so
            # keep a copy outside the working tree.
            cp script/fork-resolve /tmp/fork-resolve
            BRANCH="${{ needs.sync.outputs.branch }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git remote get-url upstream >/dev/null 2>&1; then
              git remote add upstream https://github.com/zed-industries/zed.git
            fi
            git fetch upstream
            git fetch origin
            git checkout -B "$BRANCH" "origin/$BRANCH"
            # The build check after the rebase needs the same toolchain the
            # checks use.
            ./script/linux
            sudo apt-get install -y cmake jq ripgrep xvfb libgl1-mesa-dri mesa-vulkan-drivers
            sudo sed -i '/^# sudo hint/,/^fi$/d' /etc/bash.bashrc
            ./script/download-wasi-sdk
            bash /tmp/fork-resolve --onto origin/main --model "${{ env.OPENCODE_MODEL_FALLBACK }}" --test-touched-packages
            git bundle create /tmp/resolved.bundle "$BRANCH" ^origin/main
            git log --oneline -3
          fi
          git bundle verify /tmp/resolved.bundle
          git fetch /tmp/resolved.bundle "refs/heads/${{ needs.sync.outputs.branch }}:refs/remotes/resolved/branch"

      - name: Push the resolved branch for verification
        run: |
          set -euo pipefail
          SCRATCH="sync/ai-${{ github.run_id }}"
          git push origin "refs/remotes/resolved/branch:refs/heads/$SCRATCH"

      - name: Verify the resolved branch with fork-checks
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT }}
        run: |
          set -euo pipefail
          SCRATCH="sync/ai-${{ github.run_id }}"
          gh workflow run fork-checks.yml --repo "${{ github.repository }}" --ref "$SCRATCH"

          STATUS=""
          CONCLUSION=""
          for attempt in $(seq 1 120); do
            sleep 30
            RESULT=$(gh run list --workflow fork-checks.yml --repo "${{ github.repository }}" --branch "$SCRATCH" --limit 1 \
              --json databaseId,status,conclusion --jq '.[0]? | select(. != null) | "\(.databaseId) \(.status) \(.conclusion)"' || true)
            [ -n "$RESULT" ] || continue
            RUN_ID=$(echo "$RESULT" | cut -d' ' -f1)
            STATUS=$(echo "$RESULT" | cut -d' ' -f2)
            CONCLUSION=$(echo "$RESULT" | cut -d' ' -f3)
            echo "fork-checks run $RUN_ID: $STATUS ($CONCLUSION)"
            [ "$STATUS" != "completed" ] || break
          done

          if [ "$STATUS" != "completed" ]; then
            echo "::error::fork-checks on $SCRATCH did not finish within the time budget"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::fork-checks on $SCRATCH concluded '$CONCLUSION' -- the resolution did not pass the gate; resolve the conflict locally with ./script/fork-sync"
            exit 1
          fi

      - name: Push the verified develop
        run: |
          set -euo pipefail
          git push --force-with-lease origin "refs/remotes/resolved/branch:refs/heads/${{ needs.sync.outputs.branch }}"
          gh workflow run fork-checks.yml --repo "${{ github.repository }}" --ref "${{ needs.sync.outputs.branch }}"
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT }}

  devbox-selftest:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.selftest == true }}
    runs-on: namespace-profile-zed-linux
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install the Devbox CLI
        run: |
          set -euo pipefail
          curl -fsSL get.namespace.so/devbox/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v devbox >/dev/null || {
            echo "::error::the Devbox CLI is not on PATH after the install script"
            exit 1
          }
          devbox version

      - name: Authenticate to Namespace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The runner's workload identity is scoped to the runner's own
          # features, so the API refuses to let it drive a Devbox. Exchanging
          # the job's GitHub token gives a credential for the linked
          # Namespace user instead, which carries the Devbox User role.
          if command -v nsc >/dev/null 2>&1 && nsc auth exchange-github-token; then
            echo "exchanged the job's GitHub token for a Namespace credential"
          else
            echo "::warning::the GitHub token exchange failed -- falling back to the runner's workload identity"
            TOKEN_FILE="${NSC_TOKEN_FILE:-/var/run/nsc/token.json}"
            if [ ! -f "$TOKEN_FILE" ]; then
              echo "::error::no Namespace token at $TOKEN_FILE -- the runner handed over no workload identity"
              exit 1
            fi
            mkdir -p "$HOME/.config/ns"
            [ -f "$HOME/.config/ns/config.json" ] || echo '{}' > "$HOME/.config/ns/config.json"
            cp "$TOKEN_FILE" "$HOME/.config/ns/token.json"
            chmod 600 "$HOME/.config/ns/token.json"
          fi
          devbox auth check-login || {
            echo "::error::the Devbox CLI is not authenticated"
            exit 1
          }

      - name: Run a command in the Devbox
        run: |
          set -euo pipefail
          devbox exec "${{ env.DEVBOX_NAME }}" -- bash -lc '
            set -euo pipefail
            echo "--- host ---"
            uname -a
            echo "--- tools ---"
            git --version
            cargo --version
            opencode --version
            echo "--- opencode credentials ---"
            opencode auth list || true
            echo "--- workspaces ---"
            ls /workspaces/
            echo "--- resources ---"
            nproc
            free -h | head -2
            df -h / | tail -1
          '
