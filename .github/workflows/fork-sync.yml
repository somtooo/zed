# FORK-ONLY workflow: hand-maintained, NOT generated by `cargo xtask workflows`.
# Keeps this fork's main merged with upstream. On conflict it ABORTS and fails
# so you resolve locally with opencode (see script/fork-sync) -- no AI
# auto-resolve in CI by design (needs secrets, non-deterministic, and Zed
# merge conflicts are semantic Rust/UI changes that deserve a local build).
name: fork-sync

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and merge
        run: |
          set -euo pipefail
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/zed-industries/zed.git
          fi
          git fetch upstream
          git fetch origin
          git checkout main
          BEHIND=$(git rev-list --count main..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            echo "Merge clean -- pushing."
            git push origin main
          else
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U || true
            git merge --abort
            echo "::error::Upstream merge conflicted -- aborted. Resolve locally: ./script/fork-sync, fix with opencode, push a PR."
            exit 1
          fi
