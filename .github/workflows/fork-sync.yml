# FORK-ONLY workflow: hand-maintained, NOT generated by `cargo xtask workflows`.
# Keeps this fork synced with upstream. Model: main is a pristine mirror of
# upstream/main (fast-forward only -- it must never diverge); develop carries
# all custom commits linearly on top of main. Syncing means fast-forwarding
# main, then rebasing develop. There are no merge commits in this flow.
# On rebase conflict this workflow ABORTS and fails so you resolve locally
# (see script/fork-sync, which can resolve with opencode) -- no AI
# auto-resolve in CI by design (needs secrets, non-deterministic, and rebase
# conflicts deserve a local build).
name: fork-sync

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# NOTE: rebasing develop rewrites commits that touch workflow files, and
# GitHub's built-in token can never push those (no such scope exists for
# it). This workflow therefore authenticates with a personal token stored
# as the FORK_SYNC_PAT secret (classic PAT with the `workflow` scope, or
# fine-grained with Contents + Workflows read/write). The actions: write
# permission lets the final step dispatch fork-checks on the synced develop.

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and fast-forward main
        run: |
          set -euo pipefail
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/zed-industries/zed.git
          fi
          git fetch upstream
          git fetch origin
          # Explicit -B checkouts: bare `git checkout main` is ambiguous
          # once both origin/main and upstream/main exist locally.
          git checkout -B main origin/main
          AHEAD=$(git rev-list --count upstream/main..main)
          if [ "$AHEAD" -ne 0 ]; then
            echo "::error::main has diverged from upstream/main ($AHEAD commits) -- main must stay a pristine mirror. Reset it explicitly, never merge."
            exit 1
          fi
          BEHIND=$(git rev-list --count main..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "main already up to date."
          else
            git merge --ff-only upstream/main
            git push origin main
            echo "main fast-forwarded by $BEHIND commit(s)."
          fi

      - name: Rebase develop onto main
        run: |
          set -euo pipefail
          git checkout -B develop origin/develop
          if git rebase main; then
            echo "Rebase clean."
          else
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U || true
            git rebase --abort
            echo "::error::develop rebase conflicted -- aborted. Resolve locally: ./script/fork-sync, fix with opencode, push."
            exit 1
          fi
          git diff --check
          git push --force-with-lease origin develop

      - name: Run checks on synced develop
        run: |
          set -euo pipefail
          # Pushed develop gets no CI run (fork-checks has no push trigger
          # for it, deliberately), so dispatch it explicitly.
          # --repo is mandatory: with an `upstream` remote present, gh
          # targets the parent repo (zed-industries/zed) by default.
          gh workflow run fork-checks.yml --repo "${{ github.repository }}" --ref develop
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT }}
